name: Download No-Intro DATs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar datoso con todos los plugins
        run: |
          python -m pip install --upgrade pip
          pip install "datoso[all]"

      - name: Explorar la CLI de datoso (debug)
        run: |
          echo "=== datoso --version ==="
          datoso --version || true
          echo ""
          echo "=== datoso nointro --help ==="
          datoso nointro --help || true
          echo ""
          echo "=== datoso nointro fetch --help ==="
          datoso nointro fetch --help || true

      - name: Descargar todos los DATs de No-Intro
        run: |
          # Sintaxis correcta: datoso <seed> <action>
          datoso nointro fetch

      - name: (Opcional) Procesar los DATs descargados
        continue-on-error: true
        run: |
          datoso nointro process || echo "El comando process no existe en esta versión, ignorando."

      - name: Localizar los DATs descargados
        id: locate
        run: |
          echo "Buscando archivos .dat en el sistema..."

          # Posibles rutas donde datoso guarda los archivos
          SEARCH_DIRS=(
            "$HOME/.local/share/datoso"
            "$HOME/.config/datoso"
            "$HOME/.datoso"
            "$HOME/datoso"
            "$GITHUB_WORKSPACE"
            "$GITHUB_WORKSPACE/datoso"
          )

          # Listar todo lo que existe para debug
          echo "=== Contenido de HOME ==="
          ls -la "$HOME" || true
          echo ""
          for d in "${SEARCH_DIRS[@]}"; do
            if [ -d "$d" ]; then
              echo "=== Contenido de $d ==="
              find "$d" -maxdepth 3 -type f | head -30
              echo ""
            fi
          done

          # Crear carpeta de salida y copiar todos los .dat encontrados
          mkdir -p dats
          for d in "${SEARCH_DIRS[@]}"; do
            if [ -d "$d" ]; then
              find "$d" -type f -name "*.dat" -exec cp -v {} dats/ \;
            fi
          done

          echo "======================================"
          echo "Total de DATs copiados:"
          ls -1 dats/ | wc -l
          echo "======================================"
          ls -la dats/ | head -30

          echo "count=$(ls -1 dats/ | wc -l)" >> $GITHUB_OUTPUT

      - name: Fallar si no se descargó ningún DAT
        if: steps.locate.outputs.count == '0'
        run: |
          echo "ERROR: No se encontró ningún .dat después de ejecutar datoso."
          echo "Revisa los logs del paso 'Localizar los DATs' para ver dónde buscó."
          exit 1

      - name: Comprimir DATs en un ZIP
        run: |
          cd dats
          zip -r ../no-intro-dats.zip .
          cd ..
          ls -lh no-intro-dats.zip

      - name: Subir DATs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-intro-dats-${{ github.run_number }}
          path: no-intro-dats.zip
          retention-days: 90

      - name: Commit de los DATs al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p dat_files
          cp -v dats/*.dat dat_files/ 2>/dev/null || true

          git add dat_files/
          if git diff --staged --quiet; then
            echo "Sin cambios en los DATs"
          else
            git commit -m "🤖 Actualizar DATs de No-Intro ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Crear Release con los DATs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dats-${{ github.run_number }}
          name: "No-Intro DATs #${{ github.run_number }}"
          body: |
            Descarga automatizada de los DATs de No-Intro.
            Total de DATs: ${{ steps.locate.outputs.count }}
          files: no-intro-dats.zip
          draft: false
          prerelease: false
