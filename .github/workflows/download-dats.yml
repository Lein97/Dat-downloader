name: Download No-Intro DATs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # Cada domingo 04:00 UTC

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar datoso con todos los plugins
        run: |
          python -m pip install --upgrade pip
          pip install "datoso[all]"

      - name: Diagnóstico (ayudas de la CLI)
        run: |
          echo "===== datoso --version ====="
          datoso --version || true
          echo ""
          echo "===== datoso seed --help ====="
          datoso seed --help 2>&1 || true
          echo ""
          echo "===== datoso nointro --help ====="
          datoso nointro --help 2>&1 || true

      - name: Descargar todos los DATs de No-Intro
        run: |
          set -x
          datoso nointro --fetch \
            || datoso all --fetch \
            || datoso no-intro --fetch \
            || datoso nointro -f \
            || datoso all -f \
            || (echo "❌ No se pudieron descargar los DATs" && exit 1)

      - name: Localizar los DATs descargados
        id: locate
        run: |
          echo "===== Buscando archivos .dat ====="

          SEARCH_DIRS=(
            "$HOME/.local/share/datoso"
            "$HOME/.config/datoso"
            "$HOME/.datoso"
            "$HOME/datoso"
            "$HOME/.cache/datoso"
            "/tmp/datoso"
            "$GITHUB_WORKSPACE"
          )

          mkdir -p dats

          for d in "${SEARCH_DIRS[@]}"; do
            if [ -d "$d" ]; then
              echo "Revisando $d ..."
              find "$d" -type f -name "*.dat" -exec cp -v {} dats/ \; 2>/dev/null || true
            fi
          done

          COUNT=$(find dats -type f -name "*.dat" | wc -l)
          echo "Total de DATs encontrados: $COUNT"
          ls -la dats/ | head -40

          echo "count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No se encontró ningún DAT."
            find "$HOME" -type d -name "*datoso*" 2>/dev/null || true
            exit 1
          fi

      - name: Comprimir DATs en un ZIP
        run: |
          cd dats
          zip -r ../no-intro-dats.zip .
          cd ..
          ls -lh no-intro-dats.zip

      - name: Subir DATs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-intro-dats-${{ github.run_number }}
          path: no-intro-dats.zip
          retention-days: 90

      - name: Commit de los DATs al repositorio
        if: steps.locate.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p dat_files
          cp -v dats/*.dat dat_files/ 2>/dev/null || true

          git add dat_files/
          if git diff --staged --quiet; then
            echo "Sin cambios en los DATs"
          else
            git commit -m "🤖 Actualizar DATs de No-Intro ($(date -u +%Y-%m-%d))"
            git push
          fi
