name: Download No-Intro DATs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # Domingos 04:00 UTC

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar datoso con todos los plugins
        run: |
          python -m pip install --upgrade pip
          pip install "datoso[all]"

      - name: Diagnóstico - ver versión y ayuda de datoso
        run: |
          echo "===== datoso --version ====="
          datoso --version || true
          echo ""
          echo "===== datoso --help ====="
          datoso --help || true
          echo ""
          echo "===== datoso nointro --help ====="
          datoso nointro --help || true
          echo ""
          echo "===== datoso dat --help ====="
          datoso dat --help || true

      - name: Inicializar configuración de datoso
        run: |
          # Algunos comandos requieren que el config esté inicializado
          datoso config --help || true
          # Crear directorios de salida
          mkdir -p ~/.local/share/datoso
          mkdir -p dats

      - name: Descargar todos los DATs de No-Intro
        run: |
          set -x

          # Sintaxis 1: datoso nointro fetch (la más probable)
          if datoso nointro fetch; then
            echo "✓ datoso nointro fetch OK"
            exit 0
          fi

          # Sintaxis 2: datoso nointro download
          if datoso nointro download; then
            echo "✓ datoso nointro download OK"
            exit 0
          fi

          # Sintaxis 3: datoso dat fetch nointro
          if datoso dat fetch nointro; then
            echo "✓ datoso dat fetch nointro OK"
            exit 0
          fi

          # Sintaxis 4: datoso all fetch (todos los seeds)
          if datoso all fetch; then
            echo "✓ datoso all fetch OK"
            exit 0
          fi

          echo "❌ Ninguna sintaxis funcionó. Revisa los logs de --help arriba."
          exit 1

      - name: Localizar los DATs descargados
        id: locate
        run: |
          echo "Buscando archivos .dat..."
          echo "--- Home directory structure ---"
          ls -la ~/ || true
          echo "--- ~/.local/share/datoso ---"
          ls -la ~/.local/share/datoso/ 2>/dev/null || true
          echo "--- ~/.datoso ---"
          ls -la ~/.datoso/ 2>/dev/null || true
          echo "--- Workspace ---"
          ls -la . || true

          SEARCH_DIRS=(
            "$HOME/.local/share/datoso"
            "$HOME/.datoso"
            "$HOME/datoso"
            "/tmp/datoso"
            "$GITHUB_WORKSPACE"
          )

          mkdir -p dats
          for d in "${SEARCH_DIRS[@]}"; do
            if [ -d "$d" ]; then
              echo "Revisando $d ..."
              find "$d" -type f -name "*.dat" -exec cp -v {} dats/ \; 2>/dev/null || true
            fi
          done

          COUNT=$(ls -1 dats/*.dat 2>/dev/null | wc -l)
          echo "Total de DATs copiados: $COUNT"
          ls -la dats/ | head -40

          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Fallar si no se descargó ningún DAT
        if: steps.locate.outputs.count == '0'
        run: |
          echo "❌ No se descargó ningún DAT. Revisa los pasos anteriores."
          exit 1

      - name: Comprimir DATs en un ZIP
        run: |
          cd dats
          zip -r ../no-intro-dats.zip .
          cd ..
          ls -lh no-intro-dats.zip

      - name: Subir DATs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-intro-dats-${{ github.run_number }}
          path: no-intro-dats.zip
          retention-days: 90

      - name: Commit de los DATs al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dat_files
          cp -v dats/*.dat dat_files/ 2>/dev/null || true
          git add dat_files/
          if git diff --staged --quiet; then
            echo "Sin cambios en los DATs"
          else
            git commit -m "🤖 Actualizar DATs de No-Intro ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Crear Release con los DATs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dats-${{ github.run_number }}
          name: "No-Intro DATs #${{ github.run_number }}"
          body: |
            Descarga automatizada de los DATs de No-Intro.
            Total de DATs: ${{ steps.locate.outputs.count }}
          files: no-intro-dats.zip
          draft: false
          prerelease: false
